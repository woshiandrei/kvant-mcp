<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kvant MCP</title>
  <meta name="description" content="Подключите задачи и проекты Квант к Claude, ChatGPT, Cursor или любому другому сервису с MCP.">
  <link rel="icon" href="https://static.tildacdn.com/tild6235-6161-4633-a232-313130396562/32x32.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(900px 420px at 50% -80px, rgba(76, 56, 152, 0.16), transparent 60%),
        #f3f2f6;
      color: #16161a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .card {
      background: #fff;
      border: 1px solid rgba(22, 22, 26, 0.06);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(40, 24, 72, 0.08);
      width: 100%;
      max-width: 460px;
      padding: 44px 36px 36px;
      text-align: center;
    }
    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
    .logo img { height: 28px; width: auto; }
    h1 {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 12px;
    }
    .intro {
      font-size: 16px;
      line-height: 1.55;
      color: #5c5c66;
      max-width: 34em;
      margin: 0 auto 32px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(100%, 280px);
      margin: 0 auto 28px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:focus-visible {
      outline: 2px solid #4c3898;
      outline-offset: 2px;
    }
    .btn-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: block;
    }
    .btn-primary {
      background: #4c3898;
      color: #fff;
    }
    .btn-primary:hover { background: #3d2d82; }
    .btn-secondary {
      background: #fff;
      color: #16161a;
      border-color: #e4e4ea;
    }
    .btn-secondary:hover {
      background: #faf8ff;
      border-color: #c9bddf;
    }
    .btn-cursor {
      background: #111;
      color: #fff;
    }
    .btn-cursor:hover { background: #2a2a2a; }
    .url-block {
      text-align: left;
      background: #f7f7f9;
      border-radius: 14px;
      padding: 14px 14px 12px;
    }
    .url-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .url-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #6b6b76;
    }
    .url-value {
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.45;
      color: #2a2a32;
      background: #fff;
      border: 1px solid #ececf1;
      border-radius: 10px;
      padding: 11px 12px;
      white-space: nowrap;
      overflow-x: auto;
    }
    .btn-copy {
      flex-shrink: 0;
      height: 32px;
      padding: 0 12px;
      background: #fff;
      color: #4c3898;
      border: 1px solid #d9d0ee;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-copy:hover { background: #f7f4ff; }
    .hint {
      font-size: 13px;
      line-height: 1.5;
      color: #8b8b96;
      margin-top: 16px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: #16161a;
      color: #fff;
      font-size: 14px;
      padding: 10px 16px;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    @media (max-width: 480px) {
      .card { padding: 32px 20px 24px; border-radius: 20px; }
      h1 { font-size: 28px; }
      .intro { font-size: 15px; }
      .actions { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="https://static.tildacdn.com/tild3866-3831-4362-b433-633339643533/logo_kvant.svg" alt="Квант">
    </div>
    <h1>Kvant MCP</h1>
    <p class="intro">Подключите задачи и проекты Квант к Claude, ChatGPT, Cursor или любому другому сервису с MCP.</p>

    <div class="actions">
      <a id="btn-claude" class="btn btn-primary" href="#" target="_blank" rel="noopener noreferrer">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">

        </svg>
        Add to Claude
      </a>
      <button type="button" id="btn-gpt" class="btn btn-secondary">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/>
        </svg>
        Add to ChatGPT
      </button>
      <a id="btn-cursor" class="btn btn-cursor" href="#">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#fff" d="M12 2.4 21.2 7.7 12 13 2.8 7.7 12 2.4z"/>
          <path fill="#c4c4c4" d="M2.8 9 12 14.3V21.6L2.8 16.3V9z"/>
          <path fill="#7a7a7a" d="M21.2 9 12 14.3V21.6l9.2-5.3V9z"/>
        </svg>
        Add to Cursor
      </a>
    </div>

    <div class="url-block">
      <div class="url-head">
        <div class="url-label">MCP URL</div>
        <button type="button" id="btn-copy" class="btn-copy">Скопировать</button>
      </div>
      <code id="mcp-url" class="url-value"></code>
    </div>

    <p class="hint">ChatGPT: Developer mode → Apps → Create → вставьте URL → OAuth.</p>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">Скопировано</div>

  <script>
    const SERVER_NAME = 'Kvant';
    const mcpUrl = `${window.location.origin}/api/mcp`;

    const mcpUrlEl = document.getElementById('mcp-url');
    const btnClaude = document.getElementById('btn-claude');
    const btnGpt = document.getElementById('btn-gpt');
    const btnCursor = document.getElementById('btn-cursor');
    const btnCopy = document.getElementById('btn-copy');
    const toast = document.getElementById('toast');

    mcpUrlEl.textContent = mcpUrl;

    btnClaude.href =
      'https://claude.ai/customize/connectors?modal=add-custom-connector' +
      `&connectorName=${encodeURIComponent(SERVER_NAME)}` +
      `&connectorUrl=${encodeURIComponent(mcpUrl)}`;

    const cursorConfig = btoa(JSON.stringify({ url: mcpUrl }));
    btnCursor.href =
      `cursor://anysphere.cursor-deeplink/mcp/install?name=${encodeURIComponent(SERVER_NAME)}` +
      `&config=${encodeURIComponent(cursorConfig)}`;

    let toastTimer;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    async function copyMcpUrl() {
      try {
        await navigator.clipboard.writeText(mcpUrl);
        showToast('Скопировано');
        return true;
      } catch {
        try {
          const field = document.createElement('textarea');
          field.value = mcpUrl;
          field.setAttribute('readonly', '');
          field.style.position = 'fixed';
          field.style.left = '-9999px';
          document.body.appendChild(field);
          field.select();
          const ok = document.execCommand('copy');
          field.remove();
          showToast(ok ? 'Скопировано' : 'Не удалось скопировать');
          return ok;
        } catch {
          showToast('Не удалось скопировать');
          return false;
        }
      }
    }

    btnCopy.addEventListener('click', () => {
      copyMcpUrl();
    });

    btnGpt.addEventListener('click', async () => {
      await copyMcpUrl();
      window.open('https://chatgpt.com/', '_blank', 'noopener,noreferrer');
    });
  </script>
</body>
</html>
