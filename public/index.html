<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kvant MCP</title>
  <meta name="description" content="Подключите задачи и проекты Квант к Claude, ChatGPT, Cursor или любому другому сервису с MCP.">
  <link rel="icon" href="https://static.tildacdn.com/tild6235-6161-4633-a232-313130396562/32x32.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      color: #1a1a1a;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
      border: 1px solid #e8e8e8;
      text-align: center;
    }
    .logo { display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .logo img { height: 32px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    .intro {
      font-size: 14px;
      color: #666;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      line-height: 1.2;
      height: 40px;
    }
    .btn-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: block;
    }
    .btn-primary {
      background: #4c3898;
      color: #fff;
    }
    .btn-primary:hover { background: #3d2987; }
    .btn-secondary {
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #ddd;
    }
    .btn-secondary:hover { background: #f7f4ff; border-color: #c4b8e8; }
    .cursor-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      border-radius: 10px;
      overflow: hidden;
      line-height: 0;
      cursor: pointer;
      user-select: none;
      text-decoration: none;
    }
    .cursor-badge img {
      height: 40px;
      width: auto;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .url-block {
      text-align: left;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 14px;
    }
    .url-label {
      font-size: 12px;
      font-weight: 500;
      color: #666;
      margin-bottom: 8px;
    }
    .url-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .url-value {
      flex: 1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #333;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      padding: 10px 12px;
      word-break: break-all;
      line-height: 1.4;
    }
    .btn-copy {
      flex-shrink: 0;
      padding: 0 14px;
      height: auto;
      background: #fff;
      color: #4c3898;
      border: 1px solid #c4b8e8;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-copy:hover { background: #f7f4ff; }
    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 16px;
      line-height: 1.45;
      text-align: center;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: #1a1a1a;
      color: #fff;
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      .actions { flex-direction: column; }
      .btn, .cursor-badge { width: 100%; }
      .cursor-badge { justify-content: center; }
      .url-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="https://static.tildacdn.com/tild3866-3831-4362-b433-633339643533/logo_kvant.svg" alt="Квант">
    </div>
    <h1>Kvant MCP</h1>
    <p class="intro">Подключите задачи и проекты Квант к Claude, ChatGPT, Cursor или любому другому сервису с MCP.</p>

    <div class="actions">
      <a id="btn-claude" class="btn btn-primary" href="#" target="_blank" rel="noopener noreferrer">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M12 2.5c.4 2.8 1.5 5.2 3.2 7.1 1.8 1.9 4.1 3.2 6.8 3.4-2.7.2-5 1.5-6.8 3.4-1.7 1.9-2.8 4.3-3.2 7.1-.4-2.8-1.5-5.2-3.2-7.1C7 14.5 4.7 13.2 2 13c2.7-.2 5-1.5 6.8-3.4C10.5 7.7 11.6 5.3 12 2.5z"/>
        </svg>
        Add to Claude
      </a>
      <button type="button" id="btn-gpt" class="btn btn-secondary">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .517 4.91 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.774-4.308 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.071ZM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494ZM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646ZM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872Zm16.597 3.855-5.844-3.393 2.02-1.163a.071.071 0 0 1 .071 0l4.83 2.786a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.401-.657Zm2.01-3.023-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66ZM8.306 12.863l-2.02-1.163a.08.08 0 0 1-.038-.057V6.074a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365L12 8.704l2.597 1.498v2.999L12 14.698l-2.597-1.499Z"/>
        </svg>
        Add to ChatGPT
      </button>
      <a id="btn-cursor" class="cursor-badge" href="#" rel="noopener noreferrer">
        <img src="https://cursor.com/deeplink/mcp-install-dark.svg" alt="Add Kvant MCP server to Cursor" height="40" width="180" draggable="false">
      </a>
    </div>

    <div class="url-block">
      <div class="url-label">MCP URL</div>
      <div class="url-row">
        <code id="mcp-url" class="url-value"></code>
        <button type="button" id="btn-copy" class="btn-copy">Скопировать</button>
      </div>
    </div>

    <p class="hint">ChatGPT: Developer mode → Apps → Create → вставьте URL → OAuth.</p>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">Скопировано</div>

  <script>
    const SERVER_NAME = 'Kvant';
    const mcpUrl = `${window.location.origin}/api/mcp`;

    const mcpUrlEl = document.getElementById('mcp-url');
    const btnClaude = document.getElementById('btn-claude');
    const btnGpt = document.getElementById('btn-gpt');
    const btnCursor = document.getElementById('btn-cursor');
    const btnCopy = document.getElementById('btn-copy');
    const toast = document.getElementById('toast');

    mcpUrlEl.textContent = mcpUrl;

    btnClaude.href =
      'https://claude.ai/customize/connectors?modal=add-custom-connector' +
      `&connectorName=${encodeURIComponent(SERVER_NAME)}` +
      `&connectorUrl=${encodeURIComponent(mcpUrl)}`;

    const cursorConfig = btoa(JSON.stringify({ url: mcpUrl }));
    btnCursor.href =
      `cursor://anysphere.cursor-deeplink/mcp/install?name=${encodeURIComponent(SERVER_NAME)}` +
      `&config=${encodeURIComponent(cursorConfig)}`;

    let toastTimer;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    async function copyMcpUrl() {
      try {
        await navigator.clipboard.writeText(mcpUrl);
        showToast('Скопировано');
        return true;
      } catch {
        showToast('Не удалось скопировать');
        return false;
      }
    }

    btnCopy.addEventListener('click', () => {
      copyMcpUrl();
    });

    btnGpt.addEventListener('click', async () => {
      await copyMcpUrl();
      window.open('https://chatgpt.com/', '_blank', 'noopener,noreferrer');
    });
  </script>
</body>
</html>
